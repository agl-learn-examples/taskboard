name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Course B5: a JUnit XML report (every test, pass or fail) and a coverage report, kept as artifacts
      - run: pytest -q --cov --cov-report=xml --cov-report=html --junitxml=pytest-report.xml
      - if: always()
        run: echo "Python ${{ matrix.python-version }}, coverage $(coverage report --format=total)%" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: |
            api/pytest-report.xml
            api/coverage.xml
            api/htmlcov/
          retention-days: 14

  lint:
    # Course B5: the linters as a quality check; any finding fails the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r api/requirements-dev.txt
      - run: ruff check --output-format=github .      # github: each finding also shows on the PR's line
        working-directory: api
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web

  web:
    # the Angular app's unit tests (Vitest, in a fake browser: jsdom), then a production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx ng build

  api-tests:
    # the whole stack in Docker Compose, then real HTTP requests through the gateway
    needs: test
    runs-on: ubuntu-latest
    env:
      AUTH_RATE: 600r/m          # many sign-ups in a few seconds: raise the login limit for the tests
      AUTH_BURST: 100
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: pytest tests -q
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  e2e:
    # Course B4: Playwright drives a real Chromium through the web app, against the whole stack in Compose
    needs: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e
    env:
      AUTH_RATE: 600r/m          # the same raised login limit as api-tests, so a retry never meets a 429
      AUTH_BURST: 100
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14
      - if: failure()
        run: docker compose logs
        working-directory: .
      - if: always()
        run: docker compose down -v
        working-directory: .
