# TaskBoard on your laptop: docker compose up --build
# Only the gateway is reachable from your laptop (port 8080); the other services talk on Compose's network.
services:
  gateway:
    image: nginx:1.30-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    environment:
      AUTH_RATE: ${AUTH_RATE:-10r/m}
      AUTH_BURST: ${AUTH_BURST:-5}
    volumes:
      - ./gateway/templates:/etc/nginx/templates:ro
      - ./gateway/html:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    # no ports: the API is reached only through the gateway
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    # no volume: Redis holds only short-lived data (sessions, cached plans)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
