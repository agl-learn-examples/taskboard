<section aria-labelledby="login-heading" class="narrow">
  <h1 id="login-heading">Log in</h1>
  <form [formGroup]="form" (ngSubmit)="login()" data-testid="login-form" novalidate>
    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="username" data-testid="login-email" />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <p class="field-error">Enter your email address.</p>
    }

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      data-testid="login-password"
    />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <p class="field-error">Enter your password.</p>
    }

    @if (error()) {
      <p role="alert" class="error" data-testid="login-error">{{ error() }}</p>
    }
    <button type="submit" data-testid="login-submit">Log in</button>
  </form>
</section>
