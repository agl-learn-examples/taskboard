# HTTPS for the gateway (Course A7). Only used when compose.https.yaml mounts this file; the server in
# templates/default.conf.template includes it. The certificate comes from certs/make-dev-cert.sh.
listen 443 ssl;
ssl_certificate     /etc/nginx/certs/localhost.crt;
ssl_certificate_key /etc/nginx/certs/localhost.key;

# a request that came in over plain http is sent to the https address (8443 on your laptop, see compose.https.yaml)
if ($scheme = http) {
    return 301 https://$host:8443$request_uri;
}
