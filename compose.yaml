# TaskBoard on your laptop, the whole stack in one command:
#     docker compose up --build
# Only the gateway is reachable from your laptop (port 8080); the other services talk on Compose's network.
# Settings have practice defaults here; put your own in a .env file (see .env.example) to change them.
services:
  gateway:
    build: ./web                    # nginx with the web app's files in it (web/Dockerfile)
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    environment:
      AUTH_RATE: ${AUTH_RATE:-10r/m}
      AUTH_BURST: ${AUTH_BURST:-5}
    volumes:
      - ./gateway/templates:/etc/nginx/templates:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-taskboard}:${POSTGRES_PASSWORD:-example-only-not-a-real-password}@db:5432/${POSTGRES_DB:-taskboard}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-example-only-not-a-real-jwt-secret-0123456789}
      SEED_DEMO: ${SEED_DEMO:-1}          # 1: add the demo tenants and users at start-up
    # no ports: the API is reached only through the gateway
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example-only-not-a-real-password}
      POSTGRES_DB: ${POSTGRES_DB:-taskboard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    # no volume: Redis holds only short-lived data (sessions, cached plans)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
